<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paia | Admin</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #1f2a37;
      --muted: #667085;
      --line: #d7deea;
      --accent: #4f7cff;
      --shadow: 0 18px 50px rgba(31, 42, 55, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .hidden { display: none !important; }
    h1 { margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    input, button {
      font: inherit;
    }
    input {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    button {
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .error {
      margin-top: 12px;
      color: #b42318;
      min-height: 20px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="admin-login">
      <h1>Admin</h1>
      <p>Digite a senha para acessar o painel.</p>
      <input id="admin-password" type="password" placeholder="Senha do admin" autocomplete="current-password">
      <div class="row">
        <button id="admin-enter" class="primary" type="button">Entrar</button>
      </div>
      <div id="admin-error" class="error"></div>
      <a href="/index.html">Voltar ao laboratório</a>
    </section>

    <section id="admin-panel" class="hidden">
      <h1>Painel admin</h1>
      <p>Base pronta para relatórios futuros.</p>
      <div class="row">
        <button id="admin-logout" type="button">Sair do admin</button>
        <a href="/index.html">Voltar ao laboratório</a>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_KEY = 'paia_admin_ok';
    const ADMIN_PASS = 'dopj1982';

    const login = document.getElementById('admin-login');
    const panel = document.getElementById('admin-panel');
    const input = document.getElementById('admin-password');
    const enter = document.getElementById('admin-enter');
    const logout = document.getElementById('admin-logout');
    const errorBox = document.getElementById('admin-error');

    function isAdminOk() {
      return sessionStorage.getItem(ADMIN_KEY) === 'true';
    }

    function showPanel() {
      login.classList.add('hidden');
      panel.classList.remove('hidden');
    }

    function showLogin() {
      login.classList.remove('hidden');
      panel.classList.add('hidden');
    }

    function tryLogin() {
      if (input.value.trim() === ADMIN_PASS) {
        sessionStorage.setItem(ADMIN_KEY, 'true');
        errorBox.textContent = '';
        showPanel();
        return;
      }
      errorBox.textContent = 'Senha incorreta.';
    }

    function logoutAdmin() {
      sessionStorage.removeItem(ADMIN_KEY);
      input.value = '';
      errorBox.textContent = '';
      window.location.href = '/index.html';
    }

    enter.addEventListener('click', tryLogin);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        tryLogin();
      }
    });
    logout.addEventListener('click', logoutAdmin);

    if (isAdminOk()) {
      showPanel();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
